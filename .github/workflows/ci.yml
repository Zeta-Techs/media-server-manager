name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy media_server_manager media_server_manager_web media_server_manager_worker media_server_manager_admin
      - name: Unit tests and core coverage
        run: >-
          python -m pytest
          --cov=media_server_manager.core
          --cov=media_server_manager_web.security
          --cov=media_server_manager_web.scheduling
          --cov=media_server_manager_web.services
          --cov=media_server_manager_worker.worker
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Enforce per-module coverage
        run: |
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json

          report = json.load(open("coverage.json", encoding="utf-8"))
          targets = {
              "localization core": "media_server_manager/core.py",
              "security": "media_server_manager_web/security.py",
              "queue": "media_server_manager_web/services.py",
              "worker": "media_server_manager_worker/worker.py",
          }
          failed = []
          for label, path in targets.items():
              percent = report["files"][path]["summary"]["percent_covered"]
              print(f"{label}: {percent:.2f}%")
              if percent < 90:
                  failed.append(f"{label}={percent:.2f}%")
          if failed:
              raise SystemExit("coverage below 90%: " + ", ".join(failed))
          PY

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        env:
          MSM_E2E: "1"
        run: python -m pytest -m e2e tests/test_browser.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: media-server-manager:test
      - name: Compose health check
        shell: bash
        run: |
          mkdir -p .ci-config
          sudo chown 10001:10001 .ci-config
          export MSM_IMAGE=media-server-manager:test
          export MSM_CONFIG_PATH="$PWD/.ci-config"
          docker compose up -d
          trap 'docker compose logs; docker compose down -v' EXIT
          for _ in $(seq 1 30); do
            web_status=$(docker inspect --format '{{.State.Health.Status}}' media-server-manager-web)
            worker_status=$(docker inspect --format '{{.State.Health.Status}}' media-server-manager-worker)
            if [ "$web_status" = healthy ] && [ "$worker_status" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "media-server-manager-web=$web_status media-server-manager-worker=$worker_status"
          exit 1
