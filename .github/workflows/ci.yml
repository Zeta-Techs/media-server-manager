name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy --explicit-package-bases src media_server_manager_web media_server_manager_worker media_server_manager_admin --ignore-missing-imports
      - run: python scripts/check_architecture.py
      - name: Validate Alembic bootstrap
        shell: bash
        run: |
          rm -rf .ci-config
          mkdir -p .ci-config
          MSM_DATA_DIR="$PWD/.ci-config" alembic upgrade head
          MSM_DATA_DIR="$PWD/.ci-config" alembic upgrade head
          MSM_DATA_DIR="$PWD/.ci-config" alembic check
          MSM_DATA_DIR="$PWD/.ci-config" python scripts/check_schema.py
          python -m pytest tests/test_schema_inventory.py tests/test_migration_security.py
      - name: Unit tests and core coverage
        run: >-
          python -m pytest
          --cov=src/media_server_manager
          --cov-report=term-missing
      - name: Compose syntax
        run: docker compose config

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        env:
          MSM_E2E: "1"
        run: python -m pytest -m e2e tests/test_browser.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: media-server-manager:test
      - name: Compose health check
        shell: bash
        run: |
          mkdir -p .ci-config
          sudo chown 10001:10001 .ci-config
          export MSM_IMAGE=media-server-manager:test
          export MSM_DATA_DIR="$PWD/.ci-config"
          docker compose up -d
          trap 'docker compose logs; docker compose down -v' EXIT
          for _ in $(seq 1 30); do
            web_status=$(docker inspect --format '{{.State.Health.Status}}' media-server-manager-web)
            worker_status=$(docker inspect --format '{{.State.Health.Status}}' media-server-manager-worker)
            if [ "$web_status" = healthy ] && [ "$worker_status" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          echo "media-server-manager-web=$web_status media-server-manager-worker=$worker_status"
          exit 1
