name: media-server-manager

x-msm-common: &msm-common
  image: ${MSM_IMAGE:-media-server-manager:latest}
  environment:
    TZ: Asia/Shanghai
    MSM_TIMEZONE: Asia/Shanghai
    MSM_WORKER_CONCURRENCY: "2"
    MSM_ITEM_WORKERS: "4"
  volumes:
    - ${MSM_CONFIG_PATH:-/自定义目录/media-server-manager/config}:/app/config
  restart: unless-stopped

services:
  media-server-manager-web:
    <<: *msm-common
    container_name: media-server-manager-web
    command: python -m media_server_manager_web
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  media-server-manager-worker:
    <<: *msm-common
    container_name: media-server-manager-worker
    command: python -m media_server_manager_worker
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "media_server_manager_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
