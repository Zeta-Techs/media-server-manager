name: media-server-manager-modular

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: media_server_manager
      POSTGRES_USER: msm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msm -d media_server_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.modular
    environment:
      MSM_DATABASE_URL: postgresql+psycopg://msm:${POSTGRES_PASSWORD:-change-me}@postgres:5432/media_server_manager
      MSM_REDIS_URL: redis://redis:6379/0
      MSM_ENVIRONMENT: production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8080:8080"]

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.modular
    command: celery -A apps.worker.main:celery_app worker --loglevel=INFO --queues=plex_io,media_sync,catalog_sync,notifications,maintenance,webhook
    environment:
      MSM_DATABASE_URL: postgresql+psycopg://msm:${POSTGRES_PASSWORD:-change-me}@postgres:5432/media_server_manager
      MSM_REDIS_URL: redis://redis:6379/0
      MSM_ENVIRONMENT: production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.modular
    command: python -m apps.scheduler.main
    environment:
      MSM_DATABASE_URL: postgresql+psycopg://msm:${POSTGRES_PASSWORD:-change-me}@postgres:5432/media_server_manager
      MSM_REDIS_URL: redis://redis:6379/0
      MSM_ENVIRONMENT: production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
