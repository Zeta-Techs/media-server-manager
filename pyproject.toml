[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-server-manager"
version = "2.0.0"
description = "Media server management, TMDB catalog sync, and Plex automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.15.2",
  "cryptography==46.0.6",
  "Flask==3.1.3",
  "croniter==6.0.0",
  "pypinyin==0.55.0",
  "requests==2.32.5",
  "SQLAlchemy==2.0.40",
  "waitress==3.0.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.1",
  "playwright==1.53.0",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.2",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["media_server_manager*", "media_server_manager_web*", "media_server_manager_worker*", "media_server_manager_admin*"]

[project.scripts]
msm = "media_server_manager.cli:run_cli"
msm-admin = "media_server_manager_admin.__main__:main"

[tool.setuptools.package-data]
media_server_manager = ["default_tags.json", "seeds/*.json"]
media_server_manager_web = ["templates/*.html", "static/*.css", "static/*.js", "static/views/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "e2e: browser and multi-process integration tests (set MSM_E2E=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
