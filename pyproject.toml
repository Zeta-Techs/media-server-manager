[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "media-server-manager"
version = "2.0.0"
description = "Media server management, TMDB catalog sync, and Plex automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "croniter==6.0.0",
  "pypinyin==0.55.0",
  "requests==2.32.5",
  "waitress==3.0.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.1",
  "playwright==1.53.0",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.2",
]

[tool.setuptools.packages.find]
include = ["media_server_manager*"]

[tool.setuptools.package-data]
media_server_manager = ["default_tags.json"]
media_server_manager_web = ["templates/*.html", "static/*.css", "static/*.js", "static/views/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "e2e: browser and multi-process integration tests (set MSM_E2E=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
